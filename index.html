<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#241f5e">
<title>대의초등학교 국외 수학여행</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%92%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --navy-900:#211d6b; --navy-800:#2f2a8c; --navy-700:#4841ae;
  --brass:#ff6a4d; --brass-light:#ffb238; --brass-deep:#e2482e;
  --parchment:#fff6e8; --paper:#fffefb; --ink:#241f3d; --ink-soft:#69618c; --ink-faint:#a89fc4;
  --line:#f0e0ea; --stamp:#ef4d6b; --good:#0fb28f;
  --sun:#ffb238; --sakura:#ff8fae; --mint:#0fb28f;
  --radius:22px; --radius-sm:14px;
  --shadow:0 2px 4px rgba(35,25,80,.05), 0 16px 32px -18px rgba(35,25,80,.32);
  --maxw:480px; --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(640px 320px at 8% -80px, rgba(255,178,56,.16), transparent 62%),
    radial-gradient(680px 360px at 100% 0%, rgba(255,106,77,.12), transparent 60%),
    var(--parchment);
  color:var(--ink); font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Jua','Pretendard',sans-serif; font-weight:400; letter-spacing:-.2px;}
button{font-family:inherit;}
#app{max-width:var(--maxw); margin:0 auto; min-height:100vh; background:var(--parchment); position:relative; display:flex; flex-direction:column;}
.btn, .pill, .qtab, .quickbtn, .card, .stampcard{ transition:transform .12s, box-shadow .12s; }
.btn:active, .pill:active, .qtab:active, .quickbtn:active, .stampcard:active, .qopt:active{ transform:scale(.96); }
@keyframes popIn{ 0%{transform:scale(.5); opacity:0;} 60%{transform:scale(1.08); opacity:1;} 100%{transform:scale(1);} }
@keyframes floatUp{ 0%{transform:translateY(0) scale(1); opacity:1;} 100%{transform:translateY(-46px) scale(1.3); opacity:0;} }
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* 히어로 헤더 */
.hero{ background:linear-gradient(150deg, var(--navy-900) 0%, var(--navy-700) 100%); color:#f4ecd8; padding:calc(18px + env(safe-area-inset-top, 0px)) 20px 26px; position:relative; overflow:hidden; }
.hero::before{ content:""; position:absolute; inset:0;
  background:radial-gradient(420px 200px at 90% -40px, rgba(255,178,56,.22), transparent 60%),
  radial-gradient(300px 180px at 6% 110%, rgba(255,106,77,.20), transparent 65%),
  repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 2px, transparent 2px 26px); pointer-events:none; }
.hero-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; position:relative;}
.hero-title{ font-size:21px; font-weight:700; margin:0 0 2px; line-height:1.15;
  background:linear-gradient(100deg, var(--brass-light), var(--brass) 60%); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:-.3px; }
.hero-sub{margin:0; font-size:11.5px; color:#cfd6e6; opacity:.9;}
.hero-theme{margin:2px 0 0; font-size:11px; color:var(--brass-light); opacity:.85;}
.hero-date{display:inline-flex; align-items:center; gap:6px; margin-top:9px; padding:6px 12px;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,178,56,.4); border-radius:999px; font-size:11.5px; color:#fff6e8; font-weight:600;}
.admin-btn{ background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.18); color:#f4ecd8; border-radius:999px;
  padding:6px 11px; font-size:11px; display:flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap;}
.stamp-badge{ position:relative; min-width:52px; height:52px; border-radius:50%; border:2px dashed var(--sun);
  color:#ffe9c2; background:rgba(255,178,56,.16); display:flex; flex-direction:column; align-items:center; justify-content:center;
  transform:rotate(-9deg); flex-shrink:0; box-shadow:0 0 0 3px rgba(255,178,56,.08);}
.stamp-badge b{font-family:'Jua','Pretendard',sans-serif; font-weight:400; font-size:14px; line-height:1; color:#fff3d9;}
.stamp-badge span{font-size:7.5px; letter-spacing:.02em; margin-top:2px; text-align:center; padding:0 4px;}
.ticket-notch{ height:15px; margin-top:-1px;
  background:radial-gradient(circle at 10px 0, transparent 8px, var(--parchment) 9px) repeat-x; background-size:20px 15px;}

/* 하단 메인 탭 */
.bottomnav{ position:sticky; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(6,1fr);
  background:var(--paper); border-top:1px solid var(--line); padding:8px 2px calc(8px + var(--safe-b));
  box-shadow:0 -6px 20px -14px rgba(36,31,24,.35);}
.navbtn{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:4px 1px; color:var(--ink-faint); font-size:9.6px; cursor:pointer; border-radius:10px;}
.navbtn .ic{font-size:17px; line-height:1;}
.navbtn.active{color:var(--brass-deep); font-weight:700;}

/* 서브 탭들 */
.subtabs{display:flex; gap:8px; overflow-x:auto; padding:14px 16px 4px; scrollbar-width:none;}
.subtabs::-webkit-scrollbar{display:none;}
.pill{ flex:0 0 auto; padding:9px 15px; border-radius:999px; border:1px solid var(--line); background:var(--paper);
  color:var(--ink-soft); font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; display:flex; align-items:center; gap:5px;}
.pill.active{background:var(--navy-800); border-color:var(--navy-800); color:#f4ecd8;}
.subtabs-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; padding:14px 16px 4px;}
.subtabs-grid .pill{ width:100%; white-space:normal; text-align:center; justify-content:center; padding:8px 3px; font-size:10.8px; line-height:1.25; }
.quicktabs{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px 16px 4px;}
.qtab{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 8px; border:1.5px solid var(--line);
  border-radius:14px; background:var(--paper); cursor:pointer; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.qtab .ic{font-size:23px;}
.qtab.active{background:var(--navy-800); border-color:var(--navy-800); color:#f4ecd8;}

/* 컨텐츠 카드 */
main{flex:1; padding-bottom:24px;}
.wrap{padding:16px;}
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:14px;}
.card h3{margin:0 0 10px; font-size:15.5px; display:flex; align-items:center; gap:7px;}
.card p{margin:0; color:var(--ink-soft); font-size:13.5px; line-height:1.6;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.dashed{border:none; border-top:1.5px dashed var(--line); margin:12px 0;}
.tag{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; background:#fff0d2; color:#b5660c;}
.tag.green{background:#e0f7f0; color:#0d8a6d;}
.tag.blue{background:#e7ecff; color:#3c3ba0;}
.btn{border:none; border-radius:14px; padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer; background:var(--navy-800); color:#fff6e8;}
.btn.gold{background:linear-gradient(120deg, var(--brass), var(--brass-deep)); color:#fff9f2; box-shadow:0 8px 18px -8px rgba(226,72,46,.55);}
.btn.ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink); font-weight:600;}
.btn.block{width:100%;}
.btn.sm{padding:8px 12px; font-size:12.5px; border-radius:9px;}
input[type=text], input[type=number], input[type=tel], input[type=password], textarea, select {
  width:100%; border:1.5px solid var(--line); border-radius:11px; padding:11px 13px; font-size:14px; background:var(--paper); color:var(--ink); font-family:inherit;}
textarea{resize:vertical;}
label.field{display:block; font-size:12px; color:var(--ink-soft); margin:0 0 6px; font-weight:600;}

.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px 10px; text-align:center; box-shadow:var(--shadow);}
.stat b{display:block; font-family:'Jua','Pretendard',sans-serif; font-weight:400; font-size:25px; color:var(--navy-800);}
.stat span{font-size:11px; color:var(--ink-soft);}
.quickgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.quickbtn{display:flex; flex-direction:column; align-items:center; gap:3px; padding:16px 6px; border:1px solid var(--line); border-radius:14px; background:var(--paper); cursor:pointer;}
.quickbtn .emoji{font-size:25px;}
.quickbtn b{font-size:12.5px;}
.quickbtn span{font-size:10px; color:var(--ink-soft);}
.tl{position:relative; padding-left:20px;}
.tl::before{content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1.5px; background:var(--line);}
.tl-item{position:relative; padding-bottom:20px;}
.tl-item::before{content:""; position:absolute; left:-20px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--brass); border:2px solid var(--paper); box-shadow:0 0 0 1.5px var(--brass);}
.tl-time{font-size:12px; color:var(--brass-deep); font-weight:700; font-variant-numeric:tabular-nums;}
.tl-title{font-size:14px; font-weight:600; margin:2px 0 4px;}

/* 퀴즈, 일본어, 스탬프 등 */
.qcard{border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;}
.qhead{padding:14px 16px; display:flex; gap:12px; align-items:center; cursor:pointer;}
.qhead .emo{font-size:26px;}
.qbody{padding:0 16px 16px; display:none;}
.qbody.open{display:block;}
.qopt{display:block; width:100%; text-align:left; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; margin-bottom:8px; background:var(--paper); font-size:13.5px; cursor:pointer;}
.qopt.correct{border-color:var(--good); background:#eaf5ee;}
.qopt.wrong{border-color:var(--stamp); background:#fbecea;}
.qopt[disabled]{cursor:default;}
.progress{height:8px; border-radius:999px; background:var(--line); overflow:hidden;}
.progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--brass),var(--brass-deep));}
.jpcat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:14px 16px 4px;}
.jpcat-grid .pill{ width:100%; white-space:normal; text-align:center; justify-content:center; padding:9px 4px; font-size:11.5px; }
.jpcard{border:1.5px solid var(--line); border-radius:var(--radius); background:var(--paper); box-shadow:var(--shadow); margin-bottom:10px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.jpcard.on{border-color:var(--good); background:#eafaf5;}
.jpcard-main{flex:1; cursor:pointer;}
.jpjp{font-family:'Jua','Pretendard',sans-serif; font-weight:400; font-size:18px; color:var(--navy-800); display:flex; align-items:center; gap:6px;}
.jpspk{font-size:14px; opacity:.7;}
.jpromaji{font-size:12px; color:var(--brass-deep); font-weight:700; margin-top:2px;}
.jpkr{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
.jplearn{flex-shrink:0; border:1.5px solid var(--line); border-radius:999px; background:var(--paper); color:var(--ink-soft); font-size:11.5px; font-weight:700; padding:8px 11px; cursor:pointer; white-space:nowrap;}
.jplearn.on{border-color:var(--good); background:var(--good); color:#fff;}
.pgrid2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.stampcard{border:1.5px solid var(--line); border-radius:14px; padding:14px 8px; text-align:center; background:var(--paper);}
.stampcard.on{border-color:var(--good); background:#eaf5ee;}
.stampicon{font-size:27px;}
.stampname{font-size:12px; font-weight:700; margin-top:5px;}
.stamppts{font-size:11px; color:var(--brass-deep); margin-top:2px; font-weight:700;}
.stampcard.on .stamppts{color:var(--good);}
.pgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.pgrid img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; border:1px solid var(--line);}
.pitem{position:relative;}
.pcap{font-size:11px; color:var(--ink-soft); margin-top:4px;}
.pdelete{position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%; border:none; background:rgba(20,20,20,.6); color:#fff; font-size:13px; font-weight:700; line-height:1; cursor:pointer; z-index:2; display:flex; align-items:center; justify-content:center;}
.upload-box{border:1.5px dashed var(--brass); border-radius:var(--radius-sm); padding:22px 10px; text-align:center; color:var(--brass-deep); font-size:13px; font-weight:600; cursor:pointer; background:#faf5e9;}
.gcard{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); margin-bottom:14px;}
.gcard-body{padding:16px;}
.ranklist{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
.rankrow{display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--line);}
.rankrow:last-child{border-bottom:none;}
.rankno{width:26px; height:26px; border-radius:50%; background:var(--parchment); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink-soft); flex-shrink:0;}
.rankno.gold{background:#e9c46a;color:#5c4108;} .rankno.silver{background:#d7d7d7;color:#4a4a4a;} .rankno.bronze{background:#d7a06a;color:#4a2f0d;}
.rankname{flex:1; font-weight:600; font-size:14px;}
.rankscore{font-weight:700; color:var(--brass-deep); font-variant-numeric:tabular-nums;}
.rdelete{flex-shrink:0; width:24px; height:24px; border-radius:50%; border:1px solid var(--line); background:#fff; color:#b3261e; font-size:12px; font-weight:700; line-height:1; cursor:pointer; margin-left:2px;}

/* 좌석 */
.seat{border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink);}
.seat.mine{background:#ffe9df; border-color:var(--brass); font-weight:700; color:var(--brass-deep);}
.seat.staff{background:#eef1f6; border-color:#c9d2e0;}
.pairs-card{background:linear-gradient(165deg,#fff9ef,#fff1de); border-color:#ffe0b0;}
.pairgrid{display:flex; flex-direction:column; gap:9px;}
.pairseat{display:flex; align-items:center; gap:12px; background:var(--paper); border:1.5px dashed #f0c583; border-radius:16px; padding:10px 14px;}
.pairno{flex-shrink:0; width:30px; height:30px; border-radius:50%; background:var(--sun); color:#5c3400; font-family:'Jua','Pretendard',sans-serif; font-size:13px; display:flex; align-items:center; justify-content:center; font-weight:400;}
.pairnames{flex:1; display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:700; flex-wrap:wrap;}
.pairnames .amp{color:var(--ink-faint); font-weight:400; font-size:12px;}
.pairnames .tbd{color:var(--ink-faint); font-weight:600; font-style:normal; font-size:13px;}

/* 기타 유틸 */
.contact-row{display:flex; align-items:center; gap:12px; padding:13px 0;}
.contact-row + .contact-row{border-top:1px solid var(--line);}
.avatar{width:42px; height:42px; border-radius:50%; background:var(--parchment); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
.callbtn{width:38px; height:38px; border-radius:50%; background:#eaf5ee; color:var(--good); display:flex; align-items:center; justify-content:center; text-decoration:none; font-size:16px; flex-shrink:0;}
.chk-row{display:flex; align-items:center; gap:11px; padding:11px 0; font-size:14px;}
.chk-row + .chk-row{border-top:1px solid var(--line);}
.chk-box{width:21px; height:21px; border-radius:6px; border:1.5px solid var(--brass); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer;}
.chk-box.on{background:var(--brass); color:#fff;}
.chk-row.done span.lbl{text-decoration:line-through; color:var(--ink-faint);}
#toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--navy-900); color:#f4ecd8; padding:10px 18px; border-radius:999px; font-size:13px; z-index:100; opacity:0; pointer-events:none; transition:opacity .25s, bottom .25s; max-width:88%; text-align:center;}
#toast.show{opacity:1; bottom:110px;}
.modal-back{position:fixed; inset:0; background:rgba(28,20,56,.55); z-index:200; display:flex; align-items:flex-end; justify-content:center;}
.modal-back .sheet{width:100%; max-width:var(--maxw); background:var(--paper); border-radius:20px 20px 0 0; padding:22px 18px calc(22px + var(--safe-b)); max-height:85vh; overflow-y:auto; position:relative;}
.modal-back.center{align-items:center;}
.modal-back.center .sheet{border-radius:20px; max-width:340px; margin:0 16px;}
.closeX{position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; color:var(--ink-faint); cursor:pointer;}
.empty{text-align:center; padding:36px 16px; color:var(--ink-faint); font-size:13.5px;}
.section-title{font-size:13px; font-weight:700; color:var(--brass-deep); margin:4px 0 10px; display:flex; align-items:center; gap:6px;}
.banner{background:#fff2da; border:1px solid #ffd98a; color:#8a5711; border-radius:14px; padding:11px 13px; font-size:12.5px; margin-bottom:14px; line-height:1.5;}
.banner.info{background:#eef0ff; border-color:#d2d3fb; color:#38348f;}
::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div id="app">
  <header class="hero" id="hero"></header>
  <div class="ticket-notch"></div>
  <main id="main"></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
const TRIP = {
  schoolName: '대의초등학교', shortName: '대의초', emoji: '🎒', title: '대의초등학교 국외 수학여행', subtitle: '6학년 · 일본 오사카·나라·교토·고베',
  theme: '글로벌 문화체험 · 진로탐색 (의령 공동학교)', startDate: '2026-10-27', endDate: '2026-10-30', meetTime: '05:20', meetPlace: '의령교육지원청',
  studentCount: 6, boyCount: 3, girlCount: 3, teacherCount: 1,
};
const ROSTER_DEFAULT = [
  {id:1, name:'이도원', gender:'남'}, {id:2, name:'이은호', gender:'남'}, {id:3, name:'이하성', gender:'남'},
  {id:4, name:'이은서', gender:'여'}, {id:5, name:'정지민', gender:'여'}, {id:6, name:'황서영', gender:'여'},
];
const BUS_PAIRS_DEFAULT = [
  {a: 1, b: 2, row: 1, col: 'L'},
  {a: 3, b: 4, row: 2, col: 'L'},
  {a: 5, b: 6, row: 3, col: 'L'}
];
const TEACHER_DEFAULT = {name:'신상운', phone:''};
const PRINCIPAL_DEFAULT = {name:'교장 선생님', phone:''};

function lsGet(key, def){ try{ const v=localStorage.getItem('daeui_'+key); return v===null? def : JSON.parse(v); }catch(e){ return def; } }
function lsSet(key, val){ try{ localStorage.setItem('daeui_'+key, JSON.stringify(val)); }catch(e){ console.warn('저장 실패', e); } }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return escapeHtml(s); }
function sanitizeId(s){ return (String(s).replace(/[^\w가-힣]/g,'_').slice(0,60)) || 'anon'; }

let toastTimer=null;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'), 2200); }
function celebrate(){ if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; const cx=window.innerWidth/2, cy=Math.min(210, window.innerHeight*0.28); const bits=['✨','🎉','⭐']; for(let i=0;i<7;i++){ const el=document.createElement('div'); el.textContent=bits[Math.floor(Math.random()*bits.length)]; const dx=(Math.random()-0.5)*130; el.style.cssText=`position:fixed; left:${cx+dx}px; top:${cy}px; font-size:${15+Math.random()*13}px; pointer-events:none; z-index:300; animation:floatUp ${0.7+Math.random()*0.5}s ease-out forwards;`; document.body.appendChild(el); setTimeout(()=>el.remove(), 1300); } }

function haversine(lat1,lon1,lat2,lon2){ const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); return 2*R*Math.asin(Math.sqrt(a)); }
function compressImage(file, maxW, quality){ return new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=e=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; } const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h); resolve(canvas.toDataURL('image/jpeg', quality)); }; img.onerror=()=>reject(new Error('이미지를 읽을 수 없어요')); img.src=e.target.result; }; reader.onerror=()=>reject(new Error('파일을 읽을 수 없어요')); reader.readAsDataURL(file); }); }
function todayStr(){ const t=new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function dowKo(dateStr){ return ['일','월','화','수','목','금','토'][new Date(dateStr+'T00:00:00').getDay()]; }
function fmtMD(dateStr){ const d=new Date(dateStr+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}(${dowKo(dateStr)})`; }
function fmtRangeKo(s,e){ const sd=new Date(s+'T00:00:00'), ed=new Date(e+'T00:00:00'); return `${sd.getFullYear()}.${sd.getMonth()+1}.${sd.getDate()}(${dowKo(s)}) ~ ${ed.getMonth()+1}.${ed.getDate()}(${dowKo(e)}) · 3박4일`; }
function ddayInfo(){ const today=todayStr(); const n=daysBetween(today, TRIP.startDate); const mEnd=daysBetween(today, TRIP.endDate); if(n>0) return {state:'before', daysLeft:n, badge:'D-'+n, badgeSub:'출발 전'}; if(mEnd>=0){ const dayIndex=-n; return {state:'during', dayIndex, badge:(dayIndex+1)+'일차', badgeSub:'여행 중'}; } return {state:'after', badge:'완료', badgeSub:'여행 종료'}; }
function nextPrepMilestone(){ const today=todayStr(); return PREP_TIMELINE.filter(x=>x.end>=today && !x.title.startsWith('※')).sort((a,b)=>a.start.localeCompare(b.start))[0]; }

let firebaseReady=false, db=null, isAdminSession=false;
try{ if(FIREBASE_CONFIG.apiKey){ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); firebaseReady=true; } }catch(e){}
let __firestoreWarned=false;
function warnFirestoreOnce(err){ if(__firestoreWarned) return; __firestoreWarned=true; console.warn('[대의초 앱] 서버 연결 문제', err); }
async function fetchRanking(){ if(firebaseReady){ try{ const snap=await db.collection('rankings').get(); return snap.docs.map(d=>d.data()); }catch(e){ warnFirestoreOnce(e); return []; } } return lsGet('fallback_rankings', []); }
async function submitRanking(name, data){ if(firebaseReady){ try{ await db.collection('rankings').doc(sanitizeId(name)).set(data, {merge:true}); return; }catch(e){ warnFirestoreOnce(e); } } const list=lsGet('fallback_rankings', []); const idx=list.findIndex(x=>x.name===name); if(idx>=0) list[idx]={...list[idx], ...data}; else list.push(data); lsSet('fallback_rankings', list); }
async function deleteRankingEntry(name){ if(firebaseReady){ try{ await db.collection('rankings').doc(sanitizeId(name)).delete(); return true; }catch(e){ warnFirestoreOnce(e); return false; } } const list=lsGet('fallback_rankings', []).filter(x=>x.name!==name); lsSet('fallback_rankings', list); return true; }
async function fetchGallery(){ if(firebaseReady){ try{ const snap=await db.collection('gallery').orderBy('createdAt','desc').limit(60).get(); return snap.docs.map(d=>({...d.data(), _id:d.id})); }catch(e){ warnFirestoreOnce(e); return []; } } return lsGet('fallback_gallery', []).slice().reverse(); }
async function addGalleryPhoto(payload){ if(firebaseReady){ try{ await db.collection('gallery').add(payload); return; }catch(e){ warnFirestoreOnce(e); } } const list=lsGet('fallback_gallery', []); list.push(payload); lsSet('fallback_gallery', list); }
async function deleteGalleryPhotoAt(list, i){ const p=list[i]; if(!p) return false; if(firebaseReady){ try{ await db.collection('gallery').doc(p._id).delete(); return true; }catch(e){ warnFirestoreOnce(e); return false; } } const raw=lsGet('fallback_gallery', []); const rawIdx=raw.length-1-i; raw.splice(rawIdx,1); lsSet('fallback_gallery', raw); return true; }

/* 점수 계산 */
function getMyName(){ return lsGet('myname',''); }
function quizAnswerKey(qid,qi){ return qid+'_'+qi; }
function getQuizAnswers(){ return lsGet('quiz_answers', {}); }
function setQuizAnswer(qid,qi,idx){ const a=getQuizAnswers(); a[quizAnswerKey(qid,qi)]=idx; lsSet('quiz_answers', a); }
function sumQuizScore(){ const a=getQuizAnswers(); let total=0; QUIZZES.forEach(set=>{ const per=Math.round(set.points/set.questions.length); set.questions.forEach((q,qi)=>{ if(a[quizAnswerKey(set.id,qi)]===q.answer) total+=per; }); }); return total; }
function quizSetProgress(set){ const a=getQuizAnswers(); let done=0; set.questions.forEach((q,qi)=>{ if(a[quizAnswerKey(set.id,qi)]!==undefined) done++; }); return {done, total:set.questions.length}; }
function getStamps(){ return lsGet('stamps', {}); }
function stampBonus(count){ return STAMP_BONUS_TIERS.filter(t=>count>=t.count).reduce((s,t)=>s+t.bonus,0); }
function stampPointsEarned(){ const stamps=getStamps(); return GUIDE.reduce((s,g)=> s+(stamps[g.name]? g.points:0), 0); }
function stampTotalPoints(){ const count=Object.keys(getStamps()).length; return stampPointsEarned()+stampBonus(count); }
function getPhotoChallenges(){ return lsGet('photo_challenges', {}); }
function sumPhotoScore(){ const d=getPhotoChallenges(); let s=0; PHOTO_CHALLENGES.forEach(c=>{ if(d[c.id]) s+=c.points; }); return s+lsGet('random_score', 0); }
async function syncMyScore(){
  const name=getMyName(); if(!name) return;
  const quiz=sumQuizScore(), mission=sumPhotoScore(), stampPts=stampTotalPoints();
  const jpPts = jpLearnedCount() * 5; // 일본어 5점 합산
  const total=quiz+mission+stampPts+jpPts;
  await submitRanking(name, {name, quizScore:quiz, photoScore:mission, stampScore:stampPts, jpScore:jpPts, totalScore:total, updatedAt:Date.now()});
}

function updateMyRank(){ const el=document.getElementById('myRankStat'); if(el){ const n=getMyName(); if(!n){el.textContent='–';return;} fetchRanking().then(l=>{const s=l.slice().sort((a,b)=>(b.totalScore||0)-(a.totalScore||0)); const i=s.findIndex(x=>x.name===n); el.textContent=i>=0?(i+1)+'위':'–';}); } }

function viewMission(){ const subtabs=[['quiz','🧩','퀴즈미션'],['stamp','🏅','스탬프'],['photo','📸','포토미션'],['random','🎲','랜덤미션']]; let b=''; if(ui.missionSub==='quiz') b=missionQuizHtml(); else if(ui.missionSub==='stamp') b=missionStampHtml(); else if(ui.missionSub==='photo') b=missionPhotoHtml(); else b=missionRandomHtml(); return `<div class="quicktabs">${subtabs.map(([id,ic,lbl])=>`<button class="qtab ${ui.missionSub===id?'active':''}" onclick="ui.missionSub='${id}'; renderAll();"><span class="ic">${ic}</span>${lbl}</button>`).join('')}</div><div class="wrap" style="padding-top:6px;">${b}</div>`; }
function missionQuizHtml(){ return `<div class="card"><div class="serif" style="font-size:30px; text-align:center;">${sumQuizScore()}점</div></div>`; }
function missionStampHtml(){ return `<div class="card"><button class="btn gold block" onclick="tryStamp()">📍 지금 위치로 도장 받기</button><div id="gpsStatus"></div></div>`; }
function tryStamp(){ toast('테스트용 스탬프 획득!'); }
function missionPhotoHtml(){ return `<div class="card"><label class="upload-box" style="display:block;">📷 사진을 선택하세요<input type="file" accept="image/*" style="display:none" onchange="toast('테스트 사진 제출됨')"></label></div>`; }

function missionRandomHtml(){
  const current=ui.randomMission;
  const count=lsGet('random_count_'+todayStr(), 0);
  return `<div class="card" style="text-align:center;"><h3>🎲 랜덤 미션 뽑기</h3><p>버튼을 누르면 깜짝 미션이 나타나요! <br><span style="color:var(--brass-deep); font-weight:700;">(오늘 ${count}/10회 달성)</span></p>
    ${current?`<div style="margin:16px 0; padding:16px; background:var(--parchment); border-radius:14px;"><div style="font-size:14.5px; font-weight:700;">${escapeHtml(current.title)}</div><div class="tag" style="margin-top:8px;">+${current.points}점</div></div>
      <button class="btn gold block" onclick="completeRandomMission()">완료했어요!</button>`
      :`<button class="btn gold block" style="margin-top:16px;" ${count>=10?'disabled':''} onclick="drawRandomMission()">${count>=10?'오늘 도전 끝! 내일 만나요':'🎲 미션 뽑기!'}</button>`}
  </div>`;
}
function drawRandomMission(){ if(lsGet('random_count_'+todayStr(), 0)>=10){ toast('하루 10번까지만 가능해요!'); return; } ui.randomMission=RANDOM_MISSIONS[Math.floor(Math.random()*RANDOM_MISSIONS.length)]; renderAll(); }
function completeRandomMission(){ if(!ui.randomMission) return; lsSet('random_count_'+todayStr(), lsGet('random_count_'+todayStr(), 0) + 1); lsSet('random_score', lsGet('random_score',0)+ui.randomMission.points); toast('미션 완료!'); celebrate(); ui.randomMission=null; renderAll(); syncMyScore(); }

function getJpLearned(){ return lsGet('jp_learned', {}); }
function jpKey(ci,ii){ return ci+'_'+ii; }
function jpAllCount(){ return JAPANESE_PHRASES.reduce((s,c)=>s+c.items.length,0); }
function jpLearnedCount(){ return Object.values(getJpLearned()).filter(Boolean).length; }
function speakPhraseAt(ci,ii){ toast('일본어 발음 재생: ' + JAPANESE_PHRASES[ci].items[ii].jp); }
function toggleJpLearned(ci,ii){ const learned=getJpLearned(); const key=jpKey(ci,ii); const wasOn=!!learned[key]; learned[key]=!wasOn; lsSet('jp_learned', learned); if(!wasOn) celebrate(); syncMyScore(); renderAll(); }
function viewJapanese(){
  const learned=getJpLearned(), total=jpAllCount(), done=jpLearnedCount();
  const ci=ui.jpCat||0, cat=JAPANESE_PHRASES[ci];
  let html=`<div class="wrap" style="padding-bottom:4px;"><div class="card" style="text-align:center;"><h3 style="justify-content:center;">🇯🇵 여행 일본어 미션</h3><p>외운 표현을 체크하면 <b>5점씩 랭킹에 합산</b>돼요!</p><div class="progress" style="margin-top:10px;"><i style="width:${Math.round(done/total*100)}%"></i></div><p style="margin-top:6px; font-size:12.5px; color:var(--brass-deep); font-weight:700;">${done} / ${total} 표현 외웠어요 (+${done * 5}점)</p></div></div>
  <div class="jpcat-grid">${JAPANESE_PHRASES.map((c,i)=>`<button class="pill ${ci===i?'active':''}" onclick="ui.jpCat=${i}; renderAll();">${c.icon}${c.cat}</button>`).join('')}</div><div class="wrap" style="padding-top:8px;">`;
  html+=cat.items.map((item,ii)=>{
    const on=!!learned[jpKey(ci,ii)];
    return `<div class="jpcard ${on?'on':''}"><div class="jpcard-main" onclick="speakPhraseAt(${ci},${ii})"><div class="jpjp">${escapeHtml(item.jp)} <span class="jpspk">🔊</span></div><div class="jpkr">${escapeHtml(item.kr)}</div></div><button class="jplearn ${on?'on':''}" onclick="toggleJpLearned(${ci},${ii})">${on?'✅ 외웠어요':'☐ 외우기'}</button></div>`;
  }).join('');
  return html+`</div>`;
}

function viewRank(){ return `<div class="wrap"><div class="card"><label class="field">내 이름 등록</label><div style="display:flex; gap:8px;"><input type="text" id="nameInput" placeholder="이름" value="${escAttr(getMyName())}"><button class="btn" onclick="registerName()">등록</button></div></div><div id="rankBody"></div></div>`; }
function registerName(){ const v=document.getElementById('nameInput').value.trim(); if(v){ lsSet('myname', v); toast('등록완료'); syncMyScore(); renderAll(); } }
async function loadRankBody(){ const el=document.getElementById('rankBody'); if(!el) return; const list=await fetchRanking(); const sorted=list.slice().sort((a,b)=>(b.totalScore||0)-(a.totalScore||0)); el.innerHTML=`<div class="ranklist">`+sorted.map((r,i)=>`<div class="rankrow"><div class="rankno">${i+1}</div><div class="rankname">${escapeHtml(r.name)}</div><div class="rankscore">${r.totalScore||0}점</div></div>`).join('')+`</div>`; }
function viewPhoto(){ return `<div class="wrap"><div class="card"><label class="upload-box" style="display:block;">📷 갤러리 업로드 (테스트용)</label></div></div>`; }
function viewInfo(){
  let body='';
  if(ui.infoSub==='schedule') body=`<div class="card"><h3>일정 (테스트용 간략화)</h3></div>`;
  else if(ui.infoSub==='seats') body=infoSeats();
  else body=`<div class="card"><h3>다른 메뉴</h3></div>`;
  return `<div class="subtabs-grid">${INFO_TABS.map(([id,label])=>`<button class="pill ${ui.infoSub===id?'active':''}" onclick="ui.infoSub='${id}'; renderAll();">${label}</button>`).join('')}</div><div class="wrap" style="padding-top:6px;">${body}</div>`;
}

function busPairSlotCount(){ return Math.max(1, Math.ceil(TRIP.studentCount/2)); }
function getBusPairs(){
  const saved=lsGet('bus_pairs', null);
  const n=busPairSlotCount();
  if(saved && Array.isArray(saved) && saved.length===n) return saved;
  return BUS_PAIRS_DEFAULT;
}
function busPairStudentName(id){ if(!id) return null; const roster=lsGet('roster', ROSTER_DEFAULT); const s=roster.find(r=>String(r.id)===String(id)); return s? s.name : null; }
function renderBusGrid(bus){
  let grid = Array.from({length: 12}, () => [null, null, null, null]);
  const isMine = bus.schools.some(([n])=>n===TRIP.shortName);
  
  if(isMine) {
    const pairs = getBusPairs();
    pairs.forEach(p => {
      if(p.a || p.b) {
        const r = Math.min(11, Math.max(0, (p.row || 1) - 1));
        const isLeft = p.col !== 'R';
        const nA = busPairStudentName(p.a) || '빈자리';
        const nB = busPairStudentName(p.b) || '빈자리';
        
        if(isLeft) { grid[r][0]={label:nA, mine:true}; grid[r][1]={label:nB, mine:true}; }
        else { grid[r][2]={label:nA, mine:true}; grid[r][3]={label:nB, mine:true}; }
      }
    });
  }

  const others = [];
  bus.schools.forEach(([sname, cnt]) => { if (isMine && sname === TRIP.shortName) return; for(let i=0;i<cnt;i++) others.push({label: sname, mine: false}); });
  bus.staff.forEach(([sname, cnt]) => { for(let i=0;i<cnt;i++) others.push({label: sname, mine:false, staff:true}); });
  
  let oIdx = 0;
  for(let r=0; r<12; r++) {
    for(let c=0; c<4; c++) {
      if(grid[r][c] === null && oIdx < others.length) { grid[r][c] = others[oIdx++]; }
    }
  }

  return grid.map((row, r) => {
    const renderSeat = (cell) => {
      if(!cell) return `<div class="seat" style="border:1.5px dashed var(--line); background:transparent; color:transparent;">-</div>`;
      return `<div class="seat ${cell.mine?'mine':''} ${cell.staff?'staff':''}" style="padding:8px 2px; font-size:10.5px; word-break:keep-all;">${escapeHtml(cell.label)}</div>`;
    };
    return `<div style="display:grid; grid-template-columns:26px 1fr 1fr 14px 1fr 1fr; gap:5px; align-items:center; margin-bottom:8px; text-align:center;">
      <span style="font-size:11px; color:var(--ink-soft); font-weight:700;">${r+1}열</span>
      ${renderSeat(row[0])} ${renderSeat(row[1])}
      <div></div>
      ${renderSeat(row[2])} ${renderSeat(row[3])}
    </div>`;
  }).join('');
}
function infoSeats(){
  const bi=ui.busIdx||0;
  let html=`<div class="subtabs" style="padding-left:0; padding-right:0; margin-bottom:12px;">`+BUSES_PLAN.map((b,i)=>`<button class="pill ${bi===i?'active':''}" onclick="ui.busIdx=${i}; renderAll();">🚌 ${b.id}</button>`).join('')+`</div>`;
  const bus=BUSES_PLAN[bi]; const isMine=bus.schools.some(([n])=>n===TRIP.shortName);
  html+=`<div class="card"><div class="row-between"><h3 style="margin:0;">${bus.id}${isMine?` <span class="tag">${TRIP.shortName} 탑승</span>`:''}</h3></div>
    <hr class="dashed">${renderBusGrid(bus)}</div>`;
  return html;
}

function openAdminGate(){ openCenter(`<button class="closeX" onclick="closeModal()">✕</button><h3>🔒 관리자 로그인</h3><input type="password" id="adminPass" placeholder="비밀번호"><button class="btn gold block" style="margin-top:12px;" onclick="checkAdminPass()">확인</button>`); }
function checkAdminPass(){ const v=document.getElementById('adminPass').value; if(v===lsGet('admin_pass','daeui2026')){ isAdminSession=true; closeModal(); openAdminPanel(); } else toast('비밀번호 오류'); }
function pairOptionsHtml(roster, selectedId){ let html='<option value="">미정</option>'; roster.forEach(s=>{ html+=`<option value="${s.id}" ${String(selectedId)===String(s.id)?'selected':''}>${escAttr(s.name)}</option>`; }); return html; }
function openAdminPanel(){
  const roster=lsGet('roster', ROSTER_DEFAULT), teacher=lsGet('teacher', TEACHER_DEFAULT), principal=lsGet('principal', PRINCIPAL_DEFAULT), school=lsGet('school_contact', SCHOOL_CONTACT_DEFAULT);
  const pairs=getBusPairs();
  openSheet(`<button class="closeX" onclick="closeModal()">✕</button><h3>⚙️ 관리자 설정</h3>
    <label class="field">우리 반 학생 명단 (${TRIP.studentCount}명)</label>
    <div>${roster.map(s=>`<div style="display:flex; gap:6px; margin-bottom:8px;">
        <input type="text" value="${escAttr(s.name)}" class="rname" style="flex:1;">
        <select class="rgender" style="border:1.5px solid var(--line); border-radius:11px; padding:0 8px; background:var(--paper);">
          <option value="남" ${s.gender==='남'?'selected':''}>남</option><option value="여" ${s.gender==='여'?'selected':''}>여</option>
        </select></div>`).join('')}</div>
    <hr class="dashed"><label class="field">🚌 버스 짝꿍 위치 지정 (1~12열)</label>
    ${pairs.map((p,i)=>`<div style="margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #f0f0f0;">
      <div class="pairselrow" style="margin-bottom:6px;">
        <span class="no" style="font-weight:700;">${i+1}번짝</span>
        <select class="pairSel" data-slot="${i}" data-side="a" style="flex:1;">${pairOptionsHtml(roster, p.a)}</select>
        <span style="color:var(--ink-faint);">&amp;</span>
        <select class="pairSel" data-slot="${i}" data-side="b" style="flex:1;">${pairOptionsHtml(roster, p.b)}</select>
      </div>
      <div class="pairselrow" style="padding-left:38px; display:flex; gap:6px;">
        <span style="font-size:11px; color:var(--ink-soft); width:28px;">위치:</span>
        <select class="pairRow" data-slot="${i}" style="flex:1; border:1.5px solid var(--line); border-radius:8px; padding:4px;">
          ${Array.from({length:12}, (_,r)=>`<option value="${r+1}" ${p.row===(r+1)?'selected':''}>${r+1}열</option>`).join('')}
        </select>
        <select class="pairCol" data-slot="${i}" style="flex:1; border:1.5px solid var(--line); border-radius:8px; padding:4px;">
          <option value="L" ${p.col!=='R'?'selected':''}>왼쪽 (2석)</option><option value="R" ${p.col==='R'?'selected':''}>오른쪽 (2석)</option>
        </select>
      </div>
    </div>`).join('')}
    <label class="field">담임 선생님</label>
    <input type="text" id="teacherName" placeholder="이름" value="${escAttr(teacher.name)}" style="margin-bottom:8px;">
    <input type="tel" id="teacherPhone" placeholder="연락처" value="${escAttr(teacher.phone)}">
    <hr class="dashed"><label class="field">교장 선생님</label>
    <input type="text" id="principalName" placeholder="이름" value="${escAttr(principal.name)}" style="margin-bottom:8px;">
    <input type="tel" id="principalPhone" placeholder="연락처" value="${escAttr(principal.phone)}">
    <hr class="dashed"><label class="field">학교 교무실 번호</label>
    <input type="tel" id="schoolPhone" value="${escAttr(school.office)}" style="margin-bottom:8px;">
    <hr class="dashed"><label class="field">비밀번호 변경</label>
    <input type="password" id="newPass" placeholder="새 비밀번호">
    <button class="btn gold block" style="margin-top:16px;" onclick="saveAdmin()">저장</button>
    <button class="btn ghost block" style="margin-top:8px;" onclick="resetAllData()">🗑️ 이 기기 초기화</button>
  `);
}
function saveAdmin(){
  const names=[...document.querySelectorAll('.rname')], genders=[...document.querySelectorAll('.rgender')];
  const roster=names.map((el,i)=>({id:i+1, name:el.value.trim()||('학생'+(i+1)), gender:genders[i].value}));
  lsSet('roster', roster);
  const pairs=getBusPairs().map((_,i)=>({
    a: (document.querySelector(`.pairSel[data-slot="${i}"][data-side="a"]`)||{}).value || null,
    b: (document.querySelector(`.pairSel[data-slot="${i}"][data-side="b"]`)||{}).value || null,
    row: Number((document.querySelector(`.pairRow[data-slot="${i}"]`)||{}).value) || 1,
    col: (document.querySelector(`.pairCol[data-slot="${i}"]`)||{}).value || 'L'
  }));
  lsSet('bus_pairs', pairs);
  const teacherInfo = {name:document.getElementById('teacherName').value.trim()||TEACHER_DEFAULT.name, phone:document.getElementById('teacherPhone').value.trim()};
  lsSet('teacher', teacherInfo);
  const principalInfo = {name:document.getElementById('principalName').value.trim()||PRINCIPAL_DEFAULT.name, phone:document.getElementById('principalPhone').value.trim()};
  lsSet('principal', principalInfo);
  const schoolInfo = {office:document.getElementById('schoolPhone').value.trim()};
  lsSet('school_contact', schoolInfo);
  const np=document.getElementById('newPass').value.trim(); if(np) lsSet('admin_pass', np);

  if(firebaseReady){
    db.collection('settings').doc(TRIP.shortName).set({
      roster: roster, bus_pairs: pairs, teacher: teacherInfo, principal: principalInfo, school_contact: schoolInfo, updatedAt: Date.now()
    }, {merge:true}).catch(e=>console.warn("설정 전송 실패", e));
  }
  toast('저장했어요!'); closeModal(); renderAll();
}
function resetAllData(){ if(confirm('이 기기의 모든 로컬 기록을 지울까요?')){ Object.keys(localStorage).filter(k=>k.startsWith('daeui_')).forEach(k=>localStorage.removeItem(k)); toast('초기화 완료'); closeModal(); renderAll(); } }

function init(){
  try{
    if(firebaseReady){
      db.collection('settings').doc(TRIP.shortName).onSnapshot(snap => {
        if(snap.exists){
          const data = snap.data();
          if(data.roster) lsSet('roster', data.roster);
          if(data.bus_pairs) lsSet('bus_pairs', data.bus_pairs);
          if(data.teacher) lsSet('teacher', data.teacher);
          if(data.principal) lsSet('principal', data.principal);
          if(data.school_contact) lsSet('school_contact', data.school_contact);
          renderAll();
        }
      });
    }
    renderAll();
  }
  catch(e){ console.error(e); document.getElementById('main').innerHTML='<div class="wrap"><div class="card"><h3>문제가 발생했어요</h3><p>'+escapeHtml(String(e.message||e))+'</p></div></div>'; }
}
document.addEventListener('DOMContentLoaded', init);
</script>
